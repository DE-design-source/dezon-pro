<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiteFlow</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-size='18' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E" />
    <!-- Font chọn được ở Cài đặt ▸ Giao diện (Montserrat đã có sẵn trong fonts.css). Trình duyệt chỉ tải font đang dùng. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&display=swap" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('siteflow-theme-mode');
          var t = mode === 'system' ? null : (mode || localStorage.getItem('siteflow-theme'));
          if (t !== 'light' && t !== 'dark') { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
        try {
          var c = JSON.parse(localStorage.getItem('siteflow-customize') || '{}');
          document.documentElement.setAttribute('data-accent', c.accent || 'blue');
          document.documentElement.setAttribute('data-density', c.density || 'comfortable');
          document.documentElement.setAttribute('data-sidebar-pos', c.sidebarPos || 'left');
          /* Cỡ chữ tự chỉnh + nền hệ thống: lặp lại logic của ThemeContext để không bị giật khi tải trang */
          var scale = c.fontSize === 'custom' ? Math.min(130, Math.max(10, Number(c.fontScale) || 100)) : 0;
          document.documentElement.setAttribute('data-fontsize', scale ? 'custom' : (c.fontSize || 'medium'));
          if (scale) document.documentElement.style.setProperty('--fs-user', String(scale / 100));
          document.documentElement.setAttribute('data-wallpaper', c.wallpaper || 'none');
          if (c.wallpaperStrength) document.documentElement.style.setProperty('--wp-strength', String(c.wallpaperStrength / 100));
          document.documentElement.setAttribute('data-motion', c.motion === 'off' ? 'off' : 'on');
          document.documentElement.setAttribute('data-mono', c.monoNumbers ? 'on' : 'off');
          document.documentElement.setAttribute('data-glass', c.glassLevel || 'medium');
          if (c.fontFamily) document.documentElement.style.setProperty('--app-font', c.fontFamily);
          if (c.accent === 'custom' && c.accentCustom) document.documentElement.style.setProperty('--custom-accent', c.accentCustom);
        } catch (e) {}
        try {
          var uiTheme = localStorage.getItem('siteflow-ui-theme');
          document.documentElement.setAttribute('data-ui-theme', uiTheme || 'default');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
